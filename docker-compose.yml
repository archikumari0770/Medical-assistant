services:

  postgres:
    image: postgres:16
    container_name: medgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medgraph
      POSTGRES_USER: medgraph
      POSTGRES_PASSWORD: medgraph_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: medgraph-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  qdrant:
    image: qdrant/qdrant:latest
    container_name: medgraph-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data: